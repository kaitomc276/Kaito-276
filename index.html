<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glow Mail — Hệ Thống Mail Tạm Temporarily & Developer Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root {
    --bg-void: #06050b;
    --bg-panel: rgba(19, 16, 34, 0.75);
    --bg-panel-2: rgba(26, 22, 48, 0.5);
    --line: rgba(255, 255, 255, 0.06);
    --violet: #8b5cf6;
    --magenta: #ff2f92;
    --lime: #ccff33;
    --cyan: #28f0ff;
    --text: #f3f1ff;
    --muted: #837a9f;
    --success-color: #ccff33;
    --warning-color: #ffb300;
    --rainbow-gradient: linear-gradient(45deg, #ff2f92, #ffcc00, #2cfc03, #28f0ff, #8b5cf6, #ff2f92);
  }
  * { box-sizing: border-box; }
  body {
    background: radial-gradient(circle 600px at 10% -10%, rgba(139, 92, 246, 0.18), transparent 80%), var(--bg-void);
    color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; overflow-x: hidden;
  }
  .wrap { max-width: 900px; margin: 0 auto; width: 100%; padding: 28px 18px 60px; }
  .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--lime); opacity: 0.85; margin-bottom: 10px; }
  h1 { font-family: 'Unbounded', sans-serif; font-weight: 900; font-size: clamp(36px, 8vw, 70px); margin: 0; line-height: 1.05; background: var(--rainbow-gradient); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .panel { background: var(--bg-panel); backdrop-filter: blur(16px); border: 1px solid var(--line); border-radius: 20px; padding: 24px; margin-bottom: 24px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3); }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; }
  .custom-username-input { width: 100%; padding: 14px 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg-panel-2); color: var(--text); font-size: 14px; outline: none; }
  .btn-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .btn { flex: 1; min-width: 150px; padding: 14px 20px; border: none; border-radius: 50px; font-weight: 800; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; color: #fff; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .btn-create { background: linear-gradient(135deg, var(--violet), var(--cyan), var(--magenta)); }
  .mail-list { max-height: 230px; overflow-y: auto; background: var(--bg-panel-2); border-radius: 14px; padding: 10px; border: 1px solid var(--line); }
  .mail-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.01); padding: 12px 14px; border-radius: 10px; margin-bottom: 8px; border-left: 4px solid var(--violet); cursor: pointer; }
  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--lime); color: #0a0912; padding: 12px 24px; border-radius: 50px; font-weight: 700; font-size: 13px; display: none; z-index: 99999; }
</style>
</head>
<body>

<div class="wrap" id="mainUI">
  <header>
    <div class="eyebrow">⚡ GLOW MAIL · API MAIL.TM ⚡</div>
    <h1>Glow Mail</h1>
    <p class="text-xs text-slate-400 mt-2">Hệ thống tạo mail ảo kết nối trực tiếp chuẩn mail.tm API.</p>
  </header>

  <div class="panel mt-6">
    <h2>Cấu hình định danh</h2>
    <div class="field">
      <label>Tên tài khoản (để trống tạo ngẫu nhiên)</label>
      <input type="text" class="custom-username-input" id="customUsernameInput" placeholder="Ví dụ: rikahue">
    </div>
    <div class="btn-row">
      <button class="btn btn-create" onclick="createNewMail()">⚡ Tạo Mail Mới</button>
    </div>
  </div>

  <div class="panel">
    <h2>Hộp địa chỉ đã tạo</h2>
    <div class="mail-list" id="mailList">
      <p style="text-align: center; color: var(--muted); font-size: 13px; padding: 15px 0;">Chưa có mail nào được tạo</p>
    </div>
  </div>
</div>

<!-- KHUNG HIỂN THỊ KHI GỌI QUA URL PARAMETER (DÀNH CHO APP VIA) -->
<div id="apiResultContainer" style="display:none; padding: 40px; font-family: monospace; word-break: break-all;"></div>

<div class="toast" id="toastMessage"></div>

<script>
const API_URL = 'https://api.mail.tm';
let accountsList = JSON.parse(localStorage.getItem('temp_mails_v4')) || [];
let currentActiveId = localStorage.getItem('active_mail_id_v4') || null;

// TÍCH HỢP SẴN CÁCH 1: GỌI QUA URL CHO APP AUTO / VIA
window.addEventListener('DOMContentLoaded', async () => {
  const urlParams = new URLSearchParams(window.location.search);
  const action = urlParams.get('action');

  if (action || urlParams.has('token')) {
    document.getElementById('mainUI').style.display = 'none';
    const resBox = document.getElementById('apiResultContainer');
    resBox.style.display = 'block';

    try {
      if (action === 'new') {
        const domRes = await fetch(`${API_URL}/domains`);
        const domData = await domRes.json();
        const domain = domData['hydra:member'][0].domain;
        
        const user = Math.random().toString(36).substring(2, 12);
        const address = `${user}@${domain}`;
        const password = Math.random().toString(36).substring(2, 14);

        await fetch(`${API_URL}/accounts`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ address, password })
        });

        const tokRes = await fetch(`${API_URL}/token`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ address, password })
        });
        const tokData = await tokRes.json();

        resBox.innerHTML = JSON.stringify({
          status: "success",
          email: address,
          password: password,
          token: tokData.token
        }, null, 2);
      } else if (action === 'otp') {
        const token = urlParams.get('token');
        if (!token) { resBox.innerHTML = '{"status":"error","msg":"Missing token"}'; return; }

        const msgRes = await fetch(`${API_URL}/messages`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const msgData = await msgRes.json();
        const messages = msgData['hydra:member'] || [];

        if (messages.length > 0) {
          const detailRes = await fetch(`${API_URL}/messages/${messages[0].id}`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          const detail = await detailRes.json();
          const text = detail.text || detail.html || "";
          const otpMatch = text.match(/\b\d{4,8}\b/);

          resBox.innerHTML = JSON.stringify({
            status: otpMatch ? "found" : "no_otp",
            otp: otpMatch ? otpMatch[0] : null,
            subject: messages[0].subject
          }, null, 2);
        } else {
          resBox.innerHTML = JSON.stringify({ status: "waiting", otp: null }, null, 2);
        }
      }
    } catch (err) {
      resBox.innerHTML = JSON.stringify({ status: "error", message: err.message }, null, 2);
    }
    return;
  }

  renderMailList();
});

async function createNewMail() {
  try {
    const domRes = await fetch(`${API_URL}/domains`);
    const domData = await domRes.json();
    const domains = domData['hydra:member'];
    if (!domains || domains.length === 0) throw new Error("Không lấy được tên miền!");
    const domain = domains[0].domain;

    const customVal = document.getElementById('customUsernameInput').value.trim().toLowerCase();
    const username = customVal ? customVal.replace(/[^a-z0-9]/g, '') : Math.random().toString(36).substring(2, 12);
    const address = `${username}@${domain}`;
    const password = Math.random().toString(36).substring(2, 14);

    const createRes = await fetch(`${API_URL}/accounts`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ address, password })
    });
    if (!createRes.ok) throw new Error("Tên mail đã tồn tại hoặc lỗi tạo!");
    
    const accountData = await createRes.json();
    const tokenRes = await fetch(`${API_URL}/token`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ address, password })
    });
    const tokenData = await tokenRes.json();

    accountsList.push({ id: accountData.id, address, password, token: tokenData.token });
    localStorage.setItem('temp_mails_v4', JSON.stringify(accountsList));
    renderMailList();
    showToast("Tạo mail thành công!");
    document.getElementById('customUsernameInput').value = '';
  } catch (error) {
    showToast(error.message, true);
  }
}

function renderMailList() {
  const listContainer = document.getElementById('mailList');
  if (accountsList.length === 0) {
    listContainer.innerHTML = '<p style="text-align: center; color: var(--muted); font-size: 13px; padding: 15px 0;">Chưa có mail nào</p>';
    return;
  }
  listContainer.innerHTML = '';
  accountsList.forEach(acc => {
    const item = document.createElement('div');
    item.className = 'mail-item';
    item.innerHTML = `<span style="font-size: 13px;">${acc.address}</span> <button style="background:transparent; border:none; color:var(--cyan); cursor:pointer; font-size:11px;" onclick="navigator.clipboard.writeText('${acc.address}'); showToast('Đã copy!');">📋 Copy</button>`;
    listContainer.appendChild(item);
  });
}

function showToast(message, isError = false) {
  const toast = document.getElementById('toastMessage');
  toast.innerText = message;
  toast.style.background = isError ? '#ff2f92' : '#ccff33';
  toast.style.display = 'block';
  setTimeout(() => { toast.style.display = 'none'; }, 2500);
}
</script>
</body>
</html>
